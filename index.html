<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluid Glow Animation - Local</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .stage {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
        background: #000;
      }

      .aurora-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: rotate(180deg);
        z-index: 0;
      }

      .aurora-layer canvas {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: transparent;
      }

      .logo-layer {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .standby-ui,
      .nfc-loading-ui,
      .nfc-failed-ui {
        position: absolute;
        inset: 0;
        z-index: 11;
        opacity: 0;
        pointer-events: none;
        transition: opacity 360ms ease-in-out;
      }

      .standby-ui[hidden],
      .nfc-loading-ui[hidden],
      .nfc-failed-ui[hidden] {
        display: none;
      }

      .standby-ui.is-active,
      .nfc-loading-ui.is-active,
      .nfc-failed-ui.is-active {
        opacity: 1;
      }

      .wifi-status-icon {
        position: absolute;
        top: clamp(24px, 8.333vh, 60px);
        right: clamp(24px, 7.8125vw, 100px);
        width: 34px;
        height: 34px;
      }

      .standby-card-content {
        --standby-y: 0px;
        position: absolute;
        left: 50%;
        top: 54.3%;
        width: min(70vw, 272px);
        opacity: 1;
        transform: translate(-50%, calc(-50% + var(--standby-y)));
        transition:
          opacity 360ms ease-in-out,
          transform 320ms ease-in-out;
        will-change: opacity, transform;
      }

      .standby-card-content.is-exiting {
        --standby-y: 5px;
        opacity: 0;
      }

      .standby-card-content.is-entering {
        opacity: 0;
        transition-duration: 0ms;
      }

      .standby-card-visual {
        position: relative;
        width: 100%;
        aspect-ratio: 272 / 180;
      }

      .standby-card-timecho {
        position: absolute;
        left: 4.41%;
        top: 11.11%;
        width: 94.94%;
        height: auto;
        display: block;
      }

      .standby-card-placement-card {
        position: absolute;
        left: 18.68%;
        top: -2.33%;
        width: 39.34%;
        height: auto;
        display: block;
        animation: standby-card-loop 1.9s ease-in-out infinite;
        will-change: transform, opacity;
      }

      @keyframes standby-card-loop {
        0%,
        100% {
          opacity: 0.86;
          transform: translate3d(0, -5px, 0);
        }

        48%,
        58% {
          opacity: 1;
          transform: translate3d(0, 2px, 0);
        }
      }

      .standby-card-instruction {
        margin: 30px 0 0;
        color: #fff;
        font: 500 22px/1.4 "PingFang SC", "PingFang TC", "Noto Sans SC", system-ui, sans-serif;
        text-align: center;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .nfc-loading-content,
      .nfc-failed-content {
        --loading-y: 0px;
        position: absolute;
        left: 50%;
        top: calc(50% + 31px);
        width: min(70vw, 262px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        opacity: 1;
        transform: translate(-50%, calc(-50% + var(--loading-y)));
        transition:
          opacity 360ms ease-in-out,
          transform 320ms ease-in-out;
        will-change: opacity, transform;
      }

      .nfc-loading-content.is-exiting,
      .nfc-failed-content.is-exiting {
        --loading-y: 5px;
        opacity: 0;
      }

      .nfc-loading-content.is-entering,
      .nfc-failed-content.is-entering {
        opacity: 0;
        transition-duration: 0ms;
      }

      .nfc-loading-indicator {
        --ripple-easing: linear;
        --ripple-color: 255, 255, 255;
        position: relative;
        width: min(61.07%, 160px);
        aspect-ratio: 1;
      }

      .nfc-failed-indicator {
        --ripple-color: 255, 60, 57;
        width: min(61.45%, 161px);
      }

      .nfc-loading-circle,
      .nfc-loading-spinner {
        position: absolute;
        border-radius: 50%;
      }

      .nfc-loading-circle {
        left: 50%;
        top: 50%;
        width: 100%;
        height: 100%;
        border: 2px solid rgba(var(--ripple-color), 0.5);
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.34);
        will-change: opacity, transform;
      }

      .nfc-loading-circle.ripple-primary {
        animation: nfc-circle-ripple 1.55s var(--ripple-easing) infinite;
      }

      .nfc-loading-circle.ripple-secondary {
        animation: nfc-circle-ripple 1.55s var(--ripple-easing) infinite;
        animation-delay: 0.58s;
      }

      .nfc-loading-spinner {
        left: 50%;
        top: 50%;
        width: 44.1%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        transform-origin: center;
        animation: nfc-spinner-rotate 1.1s linear infinite;
      }

      .nfc-loading-spinner-track,
      .nfc-loading-spinner-arc {
        fill: none;
        stroke-width: 8.5;
      }

      .nfc-loading-spinner-track {
        stroke: rgba(255, 255, 255, 0.22);
      }

      .nfc-loading-spinner-arc {
        stroke: rgba(255, 255, 255, 0.96);
        stroke-dasharray: 128 190;
        stroke-linecap: round;
      }

      .nfc-failed-symbol {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 39.75%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: linear-gradient(116deg, #ff9694 0%, #d42c2a 100%);
        box-shadow: 0 0 31px rgba(255, 42, 42, 0.8);
        transform: translate(-50%, -50%);
      }

      .nfc-failed-symbol::before,
      .nfc-failed-symbol::after {
        position: absolute;
        left: 50%;
        border-radius: 999px;
        background: #9b2421;
        content: "";
        transform: translateX(-50%);
      }

      .nfc-failed-symbol::before {
        top: 16%;
        width: 13%;
        height: 45%;
      }

      .nfc-failed-symbol::after {
        bottom: 15.5%;
        width: 15.5%;
        aspect-ratio: 1;
      }

      .nfc-loading-copy {
        width: 100%;
        margin: 0;
        padding: 16px 24px;
        color: #fff;
        font: 500 22px/1.4 "PingFang SC", "PingFang TC", "Noto Sans SC", system-ui, sans-serif;
        letter-spacing: 0;
        text-align: center;
        white-space: nowrap;
      }

      @keyframes nfc-spinner-rotate {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }

        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      @keyframes nfc-circle-ripple {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.34);
        }

        10% {
          opacity: 0.35;
          transform: translate(-50%, -50%) scale(0.419);
        }

        51% {
          opacity: 0.18;
          transform: translate(-50%, -50%) scale(0.739);
        }

        84% {
          opacity: 0.06;
          transform: translate(-50%, -50%) scale(1);
        }

        100% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      .splash-logo-wrap {
        width: min(70vw, 55vh, 400px);
        aspect-ratio: 400 / 226;
        pointer-events: auto;
        opacity: 1;
        transform: translateY(0);
        transition:
          opacity 180ms ease-in-out,
          transform 160ms ease-in-out;
        will-change: opacity, transform;
      }

      .splash-logo-wrap canvas,
      .splash-logo-wrap img,
      .splash-logo-wrap svg {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: contain;
      }

      .splash-logo-wrap.has-sequence img,
      .splash-logo-wrap.has-sequence svg {
        display: none;
      }

      .splash-logo-wrap.is-exiting {
        opacity: 0;
        transform: translateY(5px);
        transition-duration: 160ms;
      }

      .splash-logo-wrap.is-entering {
        opacity: 0;
        transform: translateY(0);
        transition-duration: 0ms;
      }

      .state-switcher {
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.22);
        color: rgba(255, 255, 255, 0.86);
        font: 12px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        user-select: none;
      }

      .state-button {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        font: inherit;
      }

      .state-button:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      .state-label {
        min-width: 34px;
        height: 22px;
        padding: 0 8px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        text-align: center;
        letter-spacing: 0;
      }

      .state-label:hover,
      .state-label[aria-expanded="true"] {
        background: rgba(255, 255, 255, 0.12);
      }

      .state-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 50%;
        min-width: 86px;
        padding: 6px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.56);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.32);
        transform: translateX(-50%);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .state-menu[hidden] {
        display: none;
      }

      .state-menu-option {
        width: 100%;
        height: 28px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: rgba(255, 255, 255, 0.78);
        cursor: pointer;
        font: inherit;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .state-menu-option:hover,
      .state-menu-option[aria-selected="true"] {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
      }

      @media (max-width: 520px) {
        .splash-logo-wrap {
          width: min(84vw, 55vh);
        }

        .standby-card-content {
          width: min(72vw, 272px);
        }

        .standby-card-instruction {
          font-size: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-logo-wrap {
          transition: none;
        }

        .splash-logo-wrap.is-exiting {
          transform: translateY(0);
        }

        .standby-ui,
        .standby-card-content,
        .nfc-loading-ui,
        .nfc-loading-content,
        .nfc-failed-ui,
        .nfc-failed-content {
          transition: none;
        }

        .standby-card-placement-card {
          animation: none;
        }

        .nfc-loading-circle,
        .nfc-loading-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Fluid glow splash animation">
      <div class="aurora-layer">
        <canvas id="aurora"></canvas>
      </div>

      <div class="state-switcher" aria-label="State switcher">
        <button class="state-button" id="prev-state" type="button" aria-label="Previous state">‹</button>
        <button
          class="state-label"
          id="state-label"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="state-menu"
        >
          开机
        </button>
        <button class="state-button" id="next-state" type="button" aria-label="Next state">›</button>
        <div class="state-menu" id="state-menu" role="listbox" aria-label="All states" hidden></div>
      </div>

    <script>
      const canvas = document.getElementById("aurora");
      const gl = canvas.getContext("webgl2", {
        alpha: true,
        premultipliedAlpha: true,
        antialias: true,
      });

      const colorStops = ["#FFC72F", "#FFF12F", "#FFD665", "#FFC72F"];
      const intensity = [0.6, 0.3, 0.38, 0.4];
      const amplitude = 0.8;
      const blend = 1.0;
      const speed = 0.55;

      const vertexSource = `#version 300 es
in vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

      const fragmentSource = `#version 300 es
precision highp float;

uniform float uTime;
uniform float uAmplitude;
uniform vec3 uColorStops[3];
uniform vec2 uResolution;
uniform float uBlend;

out vec4 fragColor;

vec3 permute(vec3 x) { return mod(((x * 34.0) + 1.0) * x, 289.0); }

float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                     -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
  m = m * m;
  m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

struct ColorStop {
  vec3 color;
  float position;
};

#define COLOR_RAMP(colors, factor, finalColor) {              \
  int index = 0;                                              \
  for (int i = 0; i < 2; i++) {                               \
     ColorStop currentColor = colors[i];                      \
     bool isInBetween = currentColor.position <= factor;      \
     index = int(mix(float(index), float(i), float(isInBetween))); \
  }                                                           \
  ColorStop currentColor = colors[index];                     \
  ColorStop nextColor = colors[index + 1];                    \
  float range = nextColor.position - currentColor.position;   \
  float lerpFactor = (factor - currentColor.position) / range; \
  finalColor = mix(currentColor.color, nextColor.color, lerpFactor); \
}

void main() {
  vec2 uv = gl_FragCoord.xy / uResolution;

  ColorStop colors[3];
  colors[0] = ColorStop(uColorStops[0], 0.0);
  colors[1] = ColorStop(uColorStops[1], 0.5);
  colors[2] = ColorStop(uColorStops[2], 1.0);

  vec3 rampColor;
  COLOR_RAMP(colors, uv.x, rampColor);

  float height = snoise(vec2(uv.x * 2.0 + uTime * 0.1, uTime * 0.25)) * 0.5 * uAmplitude;
  height = exp(height);
  height = (uv.y * 2.0 - height + 0.2);
  float intensity = 0.6 * height;

  float midPoint = 0.20;
  float auroraAlpha = smoothstep(midPoint - uBlend * 0.5, midPoint + uBlend * 0.5, intensity);

  vec3 auroraColor = intensity * rampColor;

  fragColor = vec4(auroraColor * auroraAlpha, auroraAlpha);
}
`;

      function parseColor(hex, dim) {
        const value = hex.replace("#", "");
        const r = parseInt(value.slice(0, 2), 16) / 255;
        const g = parseInt(value.slice(2, 4), 16) / 255;
        const b = parseInt(value.slice(4, 6), 16) / 255;
        return [r * dim, g * dim, b * dim];
      }

      function createShader(type, source) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          throw new Error(gl.getShaderInfoLog(shader));
        }
        return shader;
      }

      function createProgram() {
        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl.VERTEX_SHADER, vertexSource));
        gl.attachShader(program, createShader(gl.FRAGMENT_SHADER, fragmentSource));
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          throw new Error(gl.getProgramInfoLog(program));
        }
        return program;
      }

      if (gl) {
        const program = createProgram();
        const position = gl.getAttribLocation(program, "position");
        const uTime = gl.getUniformLocation(program, "uTime");
        const uAmplitude = gl.getUniformLocation(program, "uAmplitude");
        const uColorStops = gl.getUniformLocation(program, "uColorStops");
        const uResolution = gl.getUniformLocation(program, "uResolution");
        const uBlend = gl.getUniformLocation(program, "uBlend");

        const vertices = new Float32Array([-1, -1, 3, -1, -1, 3]);
        const buffer = gl.createBuffer();
        const vao = gl.createVertexArray();

        gl.bindVertexArray(vao);
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

        gl.clearColor(0, 0, 0, 0);
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

        function resize() {
          const rect = canvas.getBoundingClientRect();
          const dpr = Math.max(1, window.devicePixelRatio || 1);
          const width = Math.max(1, Math.round(rect.width * dpr));
          const height = Math.max(1, Math.round(rect.height * dpr));
          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
            gl.viewport(0, 0, width, height);
          }
          return [width, height];
        }

        function render(t) {
          const [width, height] = resize();
          const dimmedStops = colorStops.slice(0, 3).flatMap((color, index) => parseColor(color, intensity[index] ?? 1));

          gl.useProgram(program);
          gl.bindVertexArray(vao);
          gl.uniform1f(uTime, t * 0.01 * speed * 0.1);
          gl.uniform1f(uAmplitude, amplitude);
          gl.uniform3fv(uColorStops, new Float32Array(dimmedStops));
          gl.uniform2f(uResolution, width, height);
          gl.uniform1f(uBlend, blend);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            requestAnimationFrame(render);
          }
        }

        requestAnimationFrame(render);
        window.addEventListener("resize", resize);
      } else {
        document.querySelector(".aurora-layer").style.background =
          "radial-gradient(60% 36% at 5% 100%, rgba(255,199,47,.6), transparent 70%), radial-gradient(60% 32% at 95% 100%, rgba(255,199,47,.5), transparent 70%), radial-gradient(50% 20% at 50% 105%, rgba(255,241,47,.32), transparent 70%)";
      }

      const logoCanvas = document.getElementById("logo-sequence");
      const logoCtx = logoCanvas.getContext("2d");
      const logoWrap = document.querySelector(".splash-logo-wrap");
      const standbyUi = document.getElementById("standby-state");
      const standbyCardContent = document.getElementById("standby-card-content");
      const nfcLoadingUi = document.getElementById("nfc-loading-state");
      const nfcLoadingContent = document.getElementById("nfc-loading-content");
      const nfcFailedUi = document.getElementById("nfc-failed-state");
      const nfcFailedContent = document.getElementById("nfc-failed-content");
      const auroraLayer = document.querySelector(".aurora-layer");
      const contentStates = [
        {
          id: "boot",
          label: "开机",
          view: "sequence",
          frameCount: 118,
          fps: 18,
          path: "assets/logo-sequence",
          mode: "loop",
          fadeBackground: false,
        },
        {
          id: "standby-card-placement",
          label: "待机",
          view: "standby",
        },
        {
          id: "nfc-web-loading",
          label: "加载",
          view: "nfc-loading",
        },
        {
          id: "nfc-web-failed",
          label: "失败",
          view: "nfc-failed",
        },
      ];
      const shutdownState = {
        id: "shutdown",
        label: "关机",
        view: "sequence",
        frameCount: 159,
        fps: 18,
        path: "assets/shutdown-sequence",
        mode: "once",
        fadeBackground: true,
        fadeStart: 0.72,
      };
      const states = [...contentStates, shutdownState];
      let currentStateIndex = 0;
      let currentFrames = [];
      let logoAnimationToken = 0;
      let isStateTransitioning = false;
      let activeView = "sequence";
      const stateLabel = document.getElementById("state-label");
      const stateMenu = document.getElementById("state-menu");
      const frameCache = new Map();
      const transitionOutMs = 320;
      const transitionInMs = 360;

      function syncStateMenu() {
        stateMenu.querySelectorAll(".state-menu-option").forEach((option, index) => {
          option.setAttribute("aria-selected", String(index === currentStateIndex));
        });
      }

      function closeStateMenu() {
        stateMenu.hidden = true;
        stateLabel.setAttribute("aria-expanded", "false");
      }

      function toggleStateMenu() {
        const shouldOpen = stateMenu.hidden;
        stateMenu.hidden = !shouldOpen;
        stateLabel.setAttribute("aria-expanded", String(shouldOpen));
        if (shouldOpen) syncStateMenu();
      }

      states.forEach((state, index) => {
        const option = document.createElement("button");
        option.className = "state-menu-option";
        option.type = "button";
        option.role = "option";
        option.textContent = state.label;
        option.addEventListener("click", () => {
          closeStateMenu();
          setState(index);
        });
        stateMenu.appendChild(option);
      });
      syncStateMenu();

      function loadFrames(state) {
        if (state.view !== "sequence") return [];
        return Array.from({ length: state.frameCount }, (_, index) => {
          const img = new Image();
          img.decoding = "async";
          img.src = `${state.path}/frame_${String(index + 1).padStart(4, "0")}.png`;
          return img;
        });
      }

      function waitForFrames(frames) {
        return Promise.all(
          frames.map(
            (img) =>
              new Promise((resolve, reject) => {
                if (img.complete && img.naturalWidth) resolve();
                else {
                  img.addEventListener("load", resolve, { once: true });
                  img.addEventListener("error", reject, { once: true });
                }
              })
          )
        );
      }

      function getFrames(state) {
        if (state.view !== "sequence") return [];
        if (!frameCache.has(state.id)) {
          frameCache.set(state.id, loadFrames(state));
        }
        return frameCache.get(state.id);
      }

      const bootFrames = getFrames(states[0]);
      currentFrames = bootFrames;
      states.slice(1).forEach((state) => {
        waitForFrames(getFrames(state)).catch(() => {});
      });

      function drawLogoFrame(index) {
        const img = currentFrames[index];
        if (!img || !img.complete || !img.naturalWidth) return;
        logoCtx.clearRect(0, 0, logoCanvas.width, logoCanvas.height);
        logoCtx.drawImage(img, 0, 0, logoCanvas.width, logoCanvas.height);
      }

      function setAuroraOpacity(value) {
        auroraLayer.style.opacity = String(Math.max(0, Math.min(1, value)));
      }

      function wait(ms) {
        return new Promise((resolve) => window.setTimeout(resolve, ms));
      }

      function exitLogo() {
        logoWrap.classList.remove("is-entering");
        logoWrap.classList.add("is-exiting");
        return wait(transitionOutMs);
      }

      function enterLogo() {
        logoWrap.classList.remove("is-exiting");
        logoWrap.classList.add("is-entering");
        void logoWrap.offsetWidth;
        logoWrap.classList.remove("is-entering");
        return wait(transitionInMs);
      }

      function showLogoLayer() {
        logoWrap.hidden = false;
        standbyUi.classList.remove("is-active");
        standbyUi.hidden = true;
        nfcLoadingUi.classList.remove("is-active");
        nfcLoadingUi.hidden = true;
        nfcFailedUi.classList.remove("is-active");
        nfcFailedUi.hidden = true;

      }

      function showStandbyLayer() {
        standbyUi.hidden = false;
        standbyUi.classList.add("is-active");
        nfcLoadingUi.classList.remove("is-active");
        nfcLoadingUi.hidden = true;
        nfcFailedUi.classList.remove("is-active");
        nfcFailedUi.hidden = true;
        logoWrap.hidden = true;
        activeView = "standby";
      }

      function showNfcLoadingLayer() {
        nfcLoadingUi.hidden = false;
        nfcLoadingUi.classList.add("is-active");
        standbyUi.classList.remove("is-active");
        standbyUi.hidden = true;
        nfcFailedUi.classList.remove("is-active");
        nfcFailedUi.hidden = true;
        logoWrap.hidden = true;
        activeView = "nfc-loading";
      }

      function showNfcFailedLayer() {
        nfcFailedUi.hidden = false;
        nfcFailedUi.classList.add("is-active");
        standbyUi.classList.remove("is-active");
        standbyUi.hidden = true;
        nfcLoadingUi.classList.remove("is-active");
        nfcLoadingUi.hidden = true;
        logoWrap.hidden = true;
        activeView = "nfc-failed";
      }

      function exitStandby() {
        standbyCardContent.classList.remove("is-entering");
        standbyCardContent.classList.add("is-exiting");
        return wait(transitionOutMs);
      }

      function enterStandby() {
        standbyCardContent.classList.remove("is-exiting");
        standbyCardContent.classList.add("is-entering");
        void standbyCardContent.offsetWidth;
        standbyCardContent.classList.remove("is-entering");
        return wait(transitionInMs);
      }

      function exitNfcLoading() {
        nfcLoadingContent.classList.remove("is-entering");
        nfcLoadingContent.classList.add("is-exiting");
        return wait(transitionOutMs);
      }

      function enterNfcLoading() {
        nfcLoadingContent.classList.remove("is-exiting");
        nfcLoadingContent.classList.add("is-entering");
        void nfcLoadingContent.offsetWidth;
        nfcLoadingContent.classList.remove("is-entering");
        return wait(transitionInMs);
      }

      function exitNfcFailed() {
        nfcFailedContent.classList.remove("is-entering");
        nfcFailedContent.classList.add("is-exiting");
        return wait(transitionOutMs);
      }

      function enterNfcFailed() {
        nfcFailedContent.classList.remove("is-exiting");
        nfcFailedContent.classList.add("is-entering");
        void nfcFailedContent.offsetWidth;
        nfcFailedContent.classList.remove("is-entering");
        return wait(transitionInMs);
      }

      function exitActiveView() {
        if (activeView === "standby") return exitStandby();
        if (activeView === "nfc-loading") return exitNfcLoading();
        if (activeView === "nfc-failed") return exitNfcFailed();
        return exitLogo();
      }

      function playLogoSequence(startTime, state, token) {
        const step = (now) => {
          if (token !== logoAnimationToken) return;
          const elapsed = now - startTime;
          const frameDuration = 1000 / state.fps;
          const duration = frameDuration * state.frameCount;
          const progress = Math.min(1, elapsed / duration);
          const frame =
            state.mode === "once"
              ? Math.min(state.frameCount - 1, Math.floor(elapsed / frameDuration))
              : Math.floor(elapsed / frameDuration) % state.frameCount;

          if (state.fadeBackground) {
            const fadeStart = state.fadeStart ?? 0;
            const fadeProgress = Math.max(0, Math.min(1, (progress - fadeStart) / (1 - fadeStart)));
            setAuroraOpacity(1 - fadeProgress);
          }

          drawLogoFrame(frame);

          if (state.mode === "once" && progress >= 1) {
            logoCtx.clearRect(0, 0, logoCanvas.width, logoCanvas.height);
            if (state.fadeBackground) setAuroraOpacity(0);
            return;
          }

          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }

      async function setState(nextIndex) {
        if (isStateTransitioning) return;
        isStateTransitioning = true;
        const targetIndex = (nextIndex + states.length) % states.length;
        const state = states[targetIndex];
        const frames = getFrames(state);

        try {
          await Promise.all([exitActiveView(), waitForFrames(frames)]);
        } catch {
          document.querySelector(".splash-logo-wrap").classList.remove("has-sequence");
          isStateTransitioning = false;
          return;
        }

        currentStateIndex = targetIndex;
        stateLabel.textContent = state.label;
        syncStateMenu();
        logoAnimationToken += 1;
        const token = logoAnimationToken;
        setAuroraOpacity(1);

        if (state.view === "standby") {
          logoCtx.clearRect(0, 0, logoCanvas.width, logoCanvas.height);
          showStandbyLayer();
          await enterStandby();
        } else if (state.view === "nfc-loading") {
          logoCtx.clearRect(0, 0, logoCanvas.width, logoCanvas.height);
          showNfcLoadingLayer();
          await enterNfcLoading();
        } else if (state.view === "nfc-failed") {
          logoCtx.clearRect(0, 0, logoCanvas.width, logoCanvas.height);
          showNfcFailedLayer();
          await enterNfcFailed();
        } else {
          showLogoLayer();
          currentFrames = frames;
          logoCtx.clearRect(0, 0, logoCanvas.width, logoCanvas.height);
          drawLogoFrame(0);

          await enterLogo();
          if (token !== logoAnimationToken) {
            isStateTransitioning = false;
            return;
          }

          drawLogoFrame(0);
          if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            playLogoSequence(performance.now(), state, token);
          } else if (state.mode === "once" && state.fadeBackground) {
            logoCtx.clearRect(0, 0, logoCanvas.width, logoCanvas.height);
            setAuroraOpacity(0);
          }
        }

        isStateTransitioning = false;
      }

      stateLabel.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleStateMenu();
      });
      document.addEventListener("click", (event) => {
        if (!stateMenu.hidden && !event.target.closest(".state-switcher")) closeStateMenu();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeStateMenu();
      });
      document.getElementById("prev-state").addEventListener("click", () => setState(currentStateIndex - 1));
      document.getElementById("next-state").addEventListener("click", () => setState(currentStateIndex + 1));
      bootFrames[0].addEventListener("load", () => drawLogoFrame(0), { once: true });

      waitForFrames(bootFrames)
        .then(() => {
          logoAnimationToken += 1;
          drawLogoFrame(0);
          if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            playLogoSequence(performance.now(), states[0], logoAnimationToken);
          }
        })
        .catch(() => {
          document.querySelector(".splash-logo-wrap").classList.remove("has-sequence");
        });
    </script>
  </body>
</html>
